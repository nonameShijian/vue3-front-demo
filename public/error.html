<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>页面加载失败</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}

		.error-container {
			background: white;
			border-radius: 16px;
			padding: 40px 30px;
			max-width: 400px;
			width: 100%;
			text-align: center;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
			border: 1px solid #e4e7ed;
			animation: slideUp 0.5s ease-out;
		}

		@keyframes slideUp {
			from {
				opacity: 0;
				transform: translateY(30px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.error-icon {
			width: 80px;
			height: 80px;
			margin: 0 auto 20px;
			background: linear-gradient(135deg, #409eff 0%, #66b1ff 100%);
			border-radius: 16px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 40px;
			color: white;
			transition: all 0.3s ease;
		}

		@keyframes pulse {
			0%, 100% {
				transform: scale(1);
			}
			50% {
				transform: scale(1.05);
			}
		}

		.error-title {
			font-size: 28px;
			font-weight: bold;
			color: #303133;
			margin-bottom: 12px;
		}

		.error-message {
			font-size: 16px;
			color: #606266;
			line-height: 1.6;
			margin-bottom: 30px;
		}

		.retry-button {
			background: linear-gradient(135deg, #409eff 0%, #66b1ff 100%);
			color: white;
			border: none;
			padding: 14px 40px;
			font-size: 16px;
			font-weight: bold;
			border-radius: 8px;
			cursor: pointer;
			transition: all 0.3s ease;
			box-shadow: 0 4px 12px rgba(64, 158, 255, 0.3);
		}

		.retry-button:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 16px rgba(64, 158, 255, 0.4);
			background: linear-gradient(135deg, #66b1ff 0%, #79bbff 100%);
		}

		.retry-button:active {
			transform: translateY(0);
		}

		.help-text {
			margin-top: 20px;
			font-size: 14px;
			color: #999;
		}

		/* 深色模式 */
		@media (prefers-color-scheme: dark) {
			body {
				background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
			}

			.error-container {
				background: rgba(30, 30, 46, 0.95);
				backdrop-filter: blur(10px);
				box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
				border: 1px solid rgba(255, 255, 255, 0.1);
			}

			.error-title {
				color: #fff;
			}

			.error-message {
				color: #a3a6ad;
			}

			.help-text {
				color: #909399;
			}
		}

		/* 移动端优化 */
		@media (max-width: 480px) {
			.error-container {
				padding: 30px 20px;
			}

			.error-icon {
				width: 60px;
				height: 60px;
				font-size: 30px;
			}

			.error-title {
				font-size: 20px;
			}

			.error-message {
				font-size: 14px;
			}

			.retry-button {
				padding: 12px 30px;
				font-size: 14px;
			}
		}
	</style>
</head>
<body>
	<div class="error-container">
		<div class="error-icon">⚠️</div>
		<h1 class="error-title">页面加载失败</h1>
		<p class="error-message">
			很抱歉，应用程序遇到了错误。<br>
			请检查网络连接后重试。
		</p>
		<button class="retry-button" onclick="retry()">
			🔄 重新加载
		</button>
		<p class="help-text">
			如果问题持续存在，请联系技术支持
		</p>
	</div>

	<script>
		function retry() {
			window.location.href = '/';
		}
	</script>
</body>
</html>
